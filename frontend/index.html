<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI Shopping Video Assistant</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>AI Shopping Video Assistant</h1>

    <!-- Input Area -->
    <div class="input-area">
      <input id="productLink" placeholder="Paste product URL here" />
      <button id="genPrompts">Generate Prompts</button>
    </div>

    <!-- Prompts Area -->
    <div id="prompts" style="display:none">
      <h3>Choose a style</h3>
      <div class="output-area" id="promptsList"></div>
      <button id="genVideo" disabled>Generate Video</button>
    </div>

    <!-- Video Area -->
    <div id="videoArea" style="display:none">
      <h3>Generated video</h3>
      <div id="videoLink"></div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
